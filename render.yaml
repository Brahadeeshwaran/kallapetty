services:
  - type: web
    name: kallapetty-backend
    branch: Backend/Render
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        value: KallaPetty_2026
      - key: CORS_ORIGIN
        sync: false
