databases:
  - name: kallapetty-db
    databaseName: kallapetty
    user: admin

services:
  - type: web
    name: kallapetty-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npx ts-node prisma/seed.ts && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kallapetty-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
